title: Trey Yadon
tagline: Builder in San Diego
description: Trey Yadon builds apps in San Diego, including Who's Got It and Pour Memory. This is his computer, with photos, notes and a dog named Newton.
url: https://treyyadon.space
baseurl: ""
permalink: /notes/:title/
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
feed:
  path: feed.xml
exclude:
  - docs
  - .superpowers
  - tests
  - scripts
  - supabase
  - server
  - package.json
  - package-lock.json
  - node_modules
  - Gemfile
  - Gemfile.lock
  - README.md
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      image: /assets/img/og.png
